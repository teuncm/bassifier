<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f0ee" />
    <meta
      name="description"
      content="Unison bass synthesizer with up to five sawtooth voices, white noise, low-pass resonance, drive, and MIDI piano."
    />
    <meta name="author" content="Teun M." />
    <meta property="og:title" content="Bassifier" />
    <meta
      property="og:description"
      content="Unison bass synthesizer with up to five sawtooth voices, white noise, low-pass resonance, drive, and MIDI piano."
    />
    <meta property="og:type" content="website" />
    <title>Bassifier</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("bassifier-theme");
        } catch {}
        document.documentElement.dataset.theme = ["light", "dark"].includes(
          theme,
        )
          ? theme
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <h1>Bassifier</h1>
      <p>
        Bass synthesizer by
        <a href="https://teuncm.nl/">Teun M.</a>.
      </p>
      <noscript
        >Enable JavaScript to play the synthesizer. All sound is generated in
        your browser.</noscript
      >
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
