    <title>Bassifier — Free Online Bass Synthesizer</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Bassifier",
        "url": "https://teuncm.nl/bassifier/",
        "description": "A free online bass synthesizer with stereo unison, white noise, resonant low-pass filtering, distortion, a playable keyboard, and WAV downloads.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a browser with Web Audio support.",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "image": "https://teuncm.nl/bassifier/social-card.png",
        "author": { "@type": "Person", "name": "Teun M.", "url": "https://teuncm.nl/" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("bassifier-theme");
        } catch {}
        document.documentElement.dataset.theme = ["light", "dark"].includes(
          theme,
        )
          ? theme
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <noscript>
      <main>
        <h1>Bassifier — free online bass synthesizer</h1>
        <p>Create big bass sounds in your browser. Free to play, with no installation or account required.</p>
        <h2>Play and shape your sound</h2>
        <p>Layer up to five sawtooth voices with stereo unison, detune, white noise, a resonant low-pass filter, and parabolic distortion. Play using your computer keyboard, mouse, touch screen, or a compatible MIDI keyboard.</p>
        <h2>Randomize, download, and share</h2>
        <p>Discover new sounds with Randomize, lock your favorite settings, and watch a playful fish change with your sound. Explore the live waveform and spectrum, download 3-second or 30-second stereo WAV samples, and share a link to your bass.</p>
        <p>Created by <a href="https://teuncm.nl/">Teun M.</a>.</p>
        <p>Enable JavaScript to play the synthesizer. All sound is generated in your browser.</p>
      </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
